<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Tool</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vite@2.4.5/dist/node_modules/@vue/compiler-sfc/bundled.min.js"></script>

    <!-- https://github.com/highlightjs/highlight.js -->
    <link rel="stylesheet" href="/highlight/styles/default.min.css">
    <script src="/highlight/highlight.min.js"></script>
</head>
<body>
    <div id="app" class="container"  v-cloak>
        <div class="sidebar">
            <div class="logo">{{ logo }}</div>
            <ul class="menu">
                <li><a href="#">Summary</a></li>
                <li><a href="#">Explorer</a></li>
                <li><a href="#">Search</a></li>
                <li><a href="#">Source Control</a></li>
            </ul>
        </div>
        <div class="editor">
            <div class="summary tab_content" style="display:block;">
                <table>
                    <tr hidden><th></th><th></th></tr>
                    <tr><td>Name</td> <td><span class="highlight">{{ summary_project_name }}</span></td></tr>
                    <tr><td>Source</td><td><span class="highlight">{{ summary_project_src }}</span></td></tr>
                    <tr><td>Lang</td><td><span class="highlight">{{ summary_project_lang }}</span></td></tr>
                    <tr><td>Tags state</td><td>
                        <span class="highlight">{{ summary_project_ctag }} </span>
                        <!-- summary_ctag_btn_class -->
                        <img src="img/run_ctags.svg" :class="['btn', summary_ctag_btn_class]"  title="start ctag" v-on:click="runCtags">
                    </td></tr>
                    <tr><td>Last Indexed</td><td><span class="highlight">{{ summary_project_lastindex }}</span></td></tr>
                </table>

            </div>
            <div class="code tab_content">code</div>
        </div>
    </div>
    
    <div class="terminal-container" id="terminal-container">
        <div class="terminal-resizer" @mousedown="startResize"></div>
        <div class="terminalContent">
            <code class="js">{{ terminalContent }}</code>
        </div>
    </div>
    <script src="index.js"></script>

    <script>hljs.highlightAll();</script>
</body>
</html>
