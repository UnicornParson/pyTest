<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn Tool</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cutive+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tulpen+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <script src="/3rd/vue.global.js"></script>

    <!-- https://github.com/highlightjs/highlight.js -->
    <link rel="stylesheet" href="/highlight/styles/default.min.css">
    <script src="/highlight/highlight.min.js"></script>
</head>
<body>
    <div id="app" class="container"  v-cloak>
        <div class="sidebar">
            <div class="logo">{{ logo }}</div>
            <ul class="menu">
                <li><a href="#" v-on:click="loadSummaryPage"> ❱ Summary</a></li>
                <li><a href="#" v-on:click="loadExplorerPage"> ❱ Explorer</a></li>
                <li><a href="#"> ❱ Search</a></li>
                <li><a href="#"> ❱ Source Control</a></li>
            </ul>
        </div>
        <div class="content_box">
            <div id="content_box" class="summary tab_content" style="display:block;"></div>
        </div>
    </div>
    
    <div class="terminal-container" id="terminal-container">
        <div class="terminal-resizer" @mousedown="startResize"></div>
        <div class="terminalContent">
            <code class="js">{{ terminalContent }}</code>
        </div>
    </div>
    <script src="index.js"></script>

    <script>hljs.highlightAll();</script>
</body>
</html>
