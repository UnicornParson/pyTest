
services:
  sfx-generator:
    build: .
    ports:
      - "9005:8000"
    volumes:
      - ./audio_output:/app/audio_output
      - ./hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped