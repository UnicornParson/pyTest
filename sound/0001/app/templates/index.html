<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid SFX Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-4xl font-bold mb-2 text-purple-400">🔊 Hybrid SFX Generator</h1>
        <p class="text-gray-400 mb-8">Гибридный генератор звуковых эффектов: AI + DSP</p>

        <!-- Форма генерации -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <label class="block text-sm font-medium mb-2">Промпт</label>
            <input type="text" id="prompt" value="magical fire explosion in a cave"
                   class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded text-white focus:outline-none focus:border-purple-500 mb-4">
            <button onclick="generateSFX()" id="generateBtn"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded transition">
                Сгенерировать
            </button>
            <!-- Спиннер загрузки -->
            <div id="spinner" class="hidden mt-4 text-center">
                <svg class="animate-spin h-8 w-8 mx-auto text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <p class="text-gray-400 mt-2">Генерация...</p>
            </div>
        </div>

        <!-- История генераций -->
        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-xl font-bold mb-4">📋 История генераций</h2>
            <div id="history" class="space-y-4">
                <!-- Здесь будет список генераций -->
            </div>
        </div>
    </div>

    <script>
        // Генерация звукового эффекта
        async function generateSFX() {
            const prompt = document.getElementById('prompt').value;
            const btn = document.getElementById('generateBtn');
            const spinner = document.getElementById('spinner');
            
            btn.disabled = true;
            btn.classList.add('opacity-50');
            spinner.classList.remove('hidden');
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });
                
                if (!response.ok) throw new Error(response.statusText);
                
                const data = await response.json();
                loadHistory();
            } catch (err) {
                alert('Ошибка генерации: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
                spinner.classList.add('hidden');
            }
        }
        
        // Загрузка истории
        async function loadHistory() {
            try {
                const response = await fetch('/history');
                if (!response.ok) throw new Error(response.statusText);
                
                const items = await response.json();
                const container = document.getElementById('history');
                
                if (items.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-4">Пока ничего не сгенерировано</p>';
                    return;
                }
                
                container.innerHTML = items.map(item => `
                    <div class="bg-gray-700 rounded-lg p-4">
                        <p class="text-sm text-gray-300 mb-2 truncate">${item.prompt || 'Н/Д'}</p>
                        <audio controls class="w-full mb-2">
                            <source src="${item.url}" type="audio/wav">
                            Ваш браузер не поддерживает аудио.
                        </audio>
                        <a href="${item.url}" download class="block text-center bg-green-600 hover:bg-green-700 text-sm font-bold py-1 px-4 rounded transition">
                            ⬇ Скачать
                        </a>
                    </div>
                `).join('');
            } catch (err) {
                console.error('Ошибка загрузки истории:', err);
            }
        }
        
        // Загружаем историю при старте
        loadHistory();
    </script>
</body>
</html>
